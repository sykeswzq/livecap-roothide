name: Build LiveCap roothide deb

on:
  push:
    branches: [main]
    paths-ignore:
      - "*.deb"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: ver
        run: echo "VER=$(grep '^VER=' build.sh | cut -d= -f2)" >> "$GITHUB_OUTPUT"

      - name: Install build tools
        run: |
          command -v dpkg-deb >/dev/null 2>&1 || brew install dpkg
          if command -v ldid >/dev/null 2>&1; then
            echo "ldid: already present"
          elif brew install ldid-procursus 2>/dev/null; then
            echo "ldid: brew ldid-procursus"
          elif brew install procursus/ldid/ldid 2>/dev/null; then
            echo "ldid: brew tap"
          else
            TAG=v2.1.5-procursus7
            if [ "$(uname -m)" = "arm64" ]; then ASSET=ldid_macosx_arm64; else ASSET=ldid_macosx_x86_64; fi
            curl -sL --fail --max-time 180 -o /tmp/ldid_bin \
              "https://github.com/ProcursusTeam/ldid/releases/download/$TAG/$ASSET"
            mkdir -p "$HOME/.local/bin"
            mv /tmp/ldid_bin "$HOME/.local/bin/ldid"
            chmod +x "$HOME/.local/bin/ldid"
            echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          fi
          command -v ldid >/dev/null 2>&1 || { echo "ERROR: ldid not available"; exit 1; }
          echo "ldid OK"

      - name: Clean stale debs
        run: rm -f *.deb

      - name: Build
        run: bash build.sh

      - name: Verify deb
        run: |
          set -e
          DEB=$(ls com.sykes.livecap_*_iphoneos-arm64e.deb | head -1)
          echo "deb: $DEB"
          if dpkg-deb -c "$DEB" | grep -E '\./var/(jb|roothide)/'; then
            echo "ERROR: 检测到 ./var/jb 或 ./var/roothide 前缀"; exit 1
          fi
          dpkg-deb -c "$DEB" | grep -E '\./Library/MobileSubstrate/DynamicLibraries/LiveCap\.dylib' || { echo "ERROR: 缺 dylib"; exit 1; }
          dpkg-deb -c "$DEB" | grep -E '\./Library/MobileSubstrate/DynamicLibraries/LiveCap\.plist' || { echo "ERROR: 缺 filter plist"; exit 1; }
          dpkg-deb -c "$DEB" | grep -E '\./Library/PreferenceBundles/LiveCapPrefs\.bundle/LiveCapPrefs' || { echo "ERROR: 缺设置面板 bundle"; exit 1; }
          dpkg-deb -c "$DEB" | grep -E '\./Library/PreferenceLoader/Preferences/LiveCap\.plist' || { echo "ERROR: 缺 PreferenceLoader 入口"; exit 1; }
          echo "  (1) OK 路径与文件齐全"

          rm -rf /tmp/lccheck && mkdir -p /tmp/lccheck
          dpkg-deb -x "$DEB" /tmp/lccheck
          DYLIB=/tmp/lccheck/Library/MobileSubstrate/DynamicLibraries/LiveCap.dylib
          PPLBUNDLE=/tmp/lccheck/Library/PreferenceBundles/LiveCapPrefs.bundle/LiveCapPrefs
          m=$(python3 -c 'import sys;d=open(sys.argv[1],"rb").read(4);print(d.hex())' "$DYLIB")
          [ "$m" = "cafebabe" ] || [ "$m" = "cffaedfe" ] || { echo "ERROR: dylib magic=$m"; exit 1; }
          IDS="$(otool -D "$DYLIB" | grep -v 'architecture' | grep -v '^$' | sort -u)"
          echo "  install name: $IDS"
          echo "$IDS" | grep -q "@loader_path/.jbroot" || { echo "ERROR: LC_ID_DYLIB 不规范: $IDS"; exit 1; }

          # 代码签名有效性校验（关键）：
          # 若打包时先 ldid 签名、后修改 Mach-O header（install_name patch），
          # CodeDirectory 页哈希会失效，设备端加载报 "code signature invalid (errno=85)"，
          # tweak 静默不注入且无日志。必须在 CI 阶段拦住。
          echo "  --- verify_signature.py (重算 CodeDirectory 页哈希) ---"
          python3 verify_signature.py "$DYLIB" || { echo "ERROR: dylib 代码签名无效"; exit 1; }
          python3 verify_signature.py "$PPLBUNDLE" || { echo "ERROR: PrefBundle 代码签名无效"; exit 1; }
          # install_name 字符串必须真实存在（patch 写入了 __LINKEDIT 尾部）
          grep -aq "@loader_path/.jbroot/Library/MobileSubstrate/DynamicLibraries/LiveCap.dylib" "$DYLIB" \
            || { echo "ERROR: install_name 字符串缺失"; exit 1; }
          echo "  (2.5) OK 代码签名有效 + install_name 字符串存在"

          TPLIST=/tmp/lccheck/Library/MobileSubstrate/DynamicLibraries/LiveCap.plist
          /usr/libexec/PlistBuddy -c "Print :Filter:Bundles" "$TPLIST" | grep -q "com.google.ios.youtube" || { echo "ERROR: Filter 缺 YouTube"; exit 1; }
          if /usr/libexec/PlistBuddy -c "Print" "$TPLIST" | grep -qE '\*'; then
            echo "ERROR: Filter 含通配符"; exit 1
          fi
          # plist 里绝不能有 XML 注释：ElleKit 用 CFPropertyList 解析，
          # 遇到 <!-- --> 会导致整个 Filter 解析失败 → tweak 静默不注入、无任何日志
          if grep -q '<!--' "$TPLIST"; then
            echo "ERROR: LiveCap.plist 含 XML 注释，ElleKit 无法解析 Filter"; exit 1
          fi
          # 必须有 Mode=Any，否则 ElleKit 只按 Bundles 匹配，Executables 完全不生效
          MODE="$(/usr/libexec/PlistBuddy -c "Print :Filter:Mode" "$TPLIST" 2>/dev/null || true)"
          [ "$MODE" = "Any" ] || { echo "ERROR: Filter 缺 Mode=Any（Executables 会失效）"; exit 1; }
          # mediaserverd 是系统进程，必须在 Executables 里才能注入（音频抓取靠它）
          /usr/libexec/PlistBuddy -c "Print :Filter:Executables" "$TPLIST" 2>/dev/null | grep -q "mediaserverd" \
            || { echo "ERROR: Filter 缺 Executables=mediaserverd（抓音频依赖它）"; exit 1; }
          echo "  (2.1) OK plist 无注释 + Mode=Any + 含 mediaserverd"
          echo "  (2) OK dylib 头正常 + install name 规范 + Filter 正确"

          rm -rf /tmp/lcctl && mkdir -p /tmp/lcctl
          dpkg-deb -e "$DEB" /tmp/lcctl
          [ -f /tmp/lcctl/postinst ] || { echo "ERROR: postinst missing"; exit 1; }
          [ -x /tmp/lcctl/postinst ] || { echo "ERROR: postinst not executable"; exit 1; }
          echo "  (3) OK postinst 存在且可执行"
          echo "全部校验通过"

      - name: Verify TC3 signature logic
        env:
          # 可选：仓库 Secrets 里配置 TC3_SECRET_ID / TC3_SECRET_KEY 即可与腾讯云真实服务对拍
          # 未配置时脚本只做格式自检（校验 scope 三段 / SignedHeaders / Content-Type 无 charset）
          TC3_SECRET_ID: ${{ secrets.TC3_SECRET_ID }}
          TC3_SECRET_KEY: ${{ secrets.TC3_SECRET_KEY }}
        run: |
          set -e
          # 腾讯云 TC3 签名自检
          # 曾踩坑：credential scope 写成四段（含 region）→ "Credential scope size not valid"
          python3 verify_tc3_signature.py
          echo "  (4) OK TC3 签名逻辑符合腾讯云规范"

      - name: Verify ASR params
        env:
          TC3_SECRET_ID: ${{ secrets.TC3_SECRET_ID }}
          TC3_SECRET_KEY: ${{ secrets.TC3_SECRET_KEY }}
        run: |
          set -e
          # 腾讯云一句话识别参数自检
          # 曾踩坑: body 里带了 AppId/SecretId/VoiceId → UnknownParameter
          #         用了 16k_zh_en 引擎 → InvalidParameter(一句话识别不支持大模型)
          python3 verify_asr_params.py
          echo "  (5) OK ASR 请求参数符合腾讯云接口规范"

      - name: Verify source safety
        run: |
          set -e
          # 源码静态安全检查
          # 曾踩坑(v1.0.69): 在 UIView.hitTest 里同步写日志文件 ->
          #   hitTest 被 UIKit 高频调用, 主线程文件 I/O 触发 watchdog 杀进程 -> YouTube 闪退
          # 曾踩坑: AAC 包描述越界(官方描述是码流级的, 指向 buffer 外) -> AudioConverter 越界读
          python3 verify_source_safety.py
          echo "  (6) OK 源码无已知闪退风险"

      - name: Verify no mediaserverd injection
        run: |
          set -e
          # ===== v1.0.86 事故防线 =====
          # 真实事故：LiveCap.plist 的 Filter 里带了
          #   <key>Executables</key><string>mediaserverd</string>
          # → tweak 注入 iOS 系统媒体服务守护进程
          # → mediaserverd 崩溃循环（launchctl 状态 -11 = SIGSEGV）
          # → 微信语音 / 通话全部无声
          # 这个坑 v1.0.30 修过一次（commit 7431db0），
          # v1.0.74 改 plist 时又加了回来（commit ba3ac6d）→ 复发。
          # 现在用独立步骤硬拦，避免「改 plist 时顺手加回来」。
          if grep -q "mediaserverd" LiveCap.plist \
             && ! grep -q "mediaserverd" <(sed 's/<!--[^>]*-->//g' LiveCap.plist); then
            echo "ERROR: LiveCap.plist 仍包含 mediaserverd 注入"
            exit 1
          fi
          if grep -q "<key>Executables</key>" LiveCap.plist; then
            echo "ERROR: LiveCap.plist 出现 Executables 过滤节点（只允许 Bundles）"
            exit 1
          fi
          if grep -vE '^\s*#' postinst | grep -q "killall.*mediaserverd"; then
            echo "ERROR: postinst 仍在 killall mediaserverd（会中断所有 App 音频会话）"
            exit 1
          fi
          echo "  (6.5) OK 未注入 mediaserverd，且不会杀系统音频服务"

      - name: Verify compile risk
        run: |
          set -e
          # 编译期风险静态扫描（本地 Windows 无 xcrun，无法本地编译 dylib）
          # 曾踩坑(v1.0.82): `completion ?: [NSNull null]` ->
          #   incompatible operand types: 'void (^)(NSString *)' and 'NSNull *'
          # 曾踩坑(v1.0.82): `pad` 先用后定义 -> use of undeclared identifier 'pad'
          #   这两类都只能靠 CI 试错发现，白跑一轮 CI 往返约 5 分钟
          python3 scan_compile_risk.py
          echo "  (7) OK UIKit 符号白名单检查通过"
          python3 scan_uikit_symbols.py
          echo "  (7) OK 无编译期风险"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: livecap-deb
          path: "*.deb"
          retention-days: 30

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: "*.deb"
          tag_name: v${{ steps.ver.outputs.VER }}
          name: LiveCap v${{ steps.ver.outputs.VER }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
